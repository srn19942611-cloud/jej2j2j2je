name: Kørselslog Android

on:
  push:
    paths:
      - 'korselslog-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'korselslog-android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: korselslog-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (tax engine, segmenter, exports)
        run: ./gradlew test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: koerselslog-debug-apk
          path: korselslog-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: korselslog-android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
