# Ever Gauzy (open source projektstyring) – demo-opsætning til Coop × Solselskabet
# Baseret på ever-co/ever-gauzy docker-compose.demo.yml.
# Images er låst til de versioner, der er testet med seed-scriptet (10.11.2026).
# Start med ./start.sh – den laver .env med tilfældige nøgler første gang.

services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: gauzy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gauzy_password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./init-user-db.sh:/docker-entrypoint-initdb.d/init-user-db.sh
    networks:
      - overlay

  api:
    image: ghcr.io/ever-co/gauzy-api@sha256:ffa2be9beae4171fb2f954b053d6b256cd10bd612b446b72032495052e1c3d8e
    environment:
      DB_HOST: db
    env_file:
      - .env
    entrypoint: './entrypoint.compose.sh'
    command: ['node', 'main.js']
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    networks:
      - overlay

  webapp:
    # Dansk udgave bygget oven på det officielle image (se dansk/Dockerfile)
    build: ./dansk
    image: solselskabet-gauzy-webapp-dansk
    environment:
      DEMO: 'true'
    entrypoint: './entrypoint.compose.sh'
    # Browsere skal altid hente den aktuelle (danske) kode – ikke en gammel engelsk kopi fra cachen
    command: ['sh', '-c', "sed -i 's/public, max-age=31536000, immutable/public, no-cache/' /etc/nginx/conf.d/runtime-config-bundles.conf && exec nginx -g 'daemon off;'"]
    env_file:
      - .env
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - '4200:4200'
    networks:
      - overlay

  # Mobil-app til håndværkere (tjeklister, fotos, underskrift). Åbn http://<pc-ens-ip>:8080 på telefonen.
  feltapp:
    image: nginx:1.27-alpine
    restart: on-failure
    depends_on:
      - api
    volumes:
      - ./app:/usr/share/nginx/html:ro
      - ./app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8080:8080'
    networks:
      - overlay

volumes:
  postgres_data: {}

networks:
  overlay:
    driver: bridge
